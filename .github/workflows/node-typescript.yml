name: Node TypeScript verification

on:
  pull_request:
    paths:
      - '.github/workflows/node-typescript.yml'
      - 'starters/node-typescript/**'
      - 'contracts/openapi/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/node-typescript.yml'
      - 'starters/node-typescript/**'
      - 'contracts/openapi/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-typescript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} tests and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: starters/node-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: starters/node-typescript/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check production and test types
        run: npm run typecheck
      - name: Run architecture, HTTP, contract, and persistence tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=reports/tests.xml
      - name: Prepare disposable PostgreSQL image
        run: docker pull postgres:16-alpine
      - name: Build and test PostgreSQL connections and worker recovery
        run: npm run test:postgres
      - name: Reject high or critical dependency advisories
        if: matrix.node == '22'
        run: npm audit --audit-level=high
      - name: Retain test report and compiled sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-${{ matrix.node }}-verification
          path: |
            starters/node-typescript/reports/
            starters/node-typescript/dist/
          if-no-files-found: ignore
          retention-days: 7
