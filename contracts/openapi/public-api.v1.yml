openapi: 3.2.0
info:
  title: Modular Application Foundation Public API
  version: 1.0.0
  description: Minimal contract-first public API example for the documentation-first foundation.
servers:
  - url: https://api.example.com/api/v1
paths:
  /identity/auth/login:
    post:
      operationId: login
      summary: Authenticate a user
      description: The reference HTTP adapter rejects JSON bodies larger than 65536 bytes.
      tags: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Authentication failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid login request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: JSON body exceeds the reference adapter's 65536-byte limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Login attempts exceeded the configured limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /identity/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token for an active session
      description: Reuse of a consumed refresh token revokes the entire session family. Session expiry is absolute and is not extended by refresh. The reference HTTP adapter rejects JSON bodies larger than 65536 bytes.
      tags: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refreshed access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid refresh request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid, expired, revoked, or reused refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: JSON body exceeds the reference adapter's 65536-byte limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /identity/auth/logout:
    post:
      operationId: logout
      summary: Revoke the session associated with the bearer access token
      tags: [identity]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Session revoked; all access and refresh tokens for this session are invalid
        '401':
          description: A valid access token for an active session is required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /identity/me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated identity summary
      tags: [identity]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current identity summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Permission denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Caller-provided request identifier used for logs and support.
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
      description: Correlation identifier propagated across commands, events, and jobs.
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 1024
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    LoginResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: object
          required: [access_token, refresh_token, token_type, expires_in]
          additionalProperties: false
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
              const: Bearer
            expires_in:
              type: integer
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CurrentUserResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/CurrentUser'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CurrentUser:
      type: object
      required: [id, email, permissions]
      additionalProperties: false
      properties:
        id:
          type: string
          example: usr_123
        email:
          type: string
          format: email
        permissions:
          type: array
          items:
            type: string
          example:
            - identity.user.read
    ResponseMeta:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
        correlation_id:
          type: string
    ProblemDetails:
      type: object
      required: [type, title, status]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
security:
  - bearerAuth: []
